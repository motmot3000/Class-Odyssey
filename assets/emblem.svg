<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Class Odyssey crest">
  <defs>
    <linearGradient id="emGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#F2C24E"/>
      <stop offset="1" stop-color="#D9A62E"/>
    </linearGradient>
    <linearGradient id="emField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C50A6"/>
      <stop offset="1" stop-color="#152A60"/>
    </linearGradient>
  </defs>

  <!-- Bouclier (or) -->
  <path d="M32 3 L54 9 C59 12 61 17 61 22 L61 34 C61 46 49 56 32 61 C15 56 3 46 3 34 L3 22 C3 17 5 12 10 9 Z"
        fill="url(#emGold)" stroke="#8F6B1E" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Champ intérieur (bleu) -->
  <path d="M32 7 L50 12 C54.5 14.5 56.5 18.5 56.5 22.5 L56.5 33.5 C56.5 43.5 46.5 52.5 32 57 C17.5 52.5 7.5 43.5 7.5 33.5 L7.5 22.5 C7.5 18.5 9.5 14.5 14 12 Z"
        fill="url(#emField)" stroke="#4A6BBE" stroke-width="1" stroke-linejoin="round"/>

  <!-- Étoile à huit rais -->
  <path d="M47 33 L35.9 29.1 L32 18 L28.1 29.1 L17 33 L28.1 36.9 L32 48 L35.9 36.9 Z"
        fill="url(#emGold)" stroke="#8F6B1E" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Reflet central -->
  <path d="M32 29 L35 33 L32 37 L29 33 Z" fill="#FFF4CC"/>
</svg>
