    <script>
      // The app may be served under a sub-path (e.g. /class-odyssey). Relative
      // URLs — assets and the /api routes alike — only resolve correctly when
      // the path ends with a slash, so restore it before anything else loads.
      // A last segment containing a dot is a file (index.html): leave it alone.
      const last = location.pathname.split("/").pop();
      if (last && !last.includes(".")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
      // Light on first visit; preserve an explicit choice before styles load.
      try {
        const savedTheme = localStorage.getItem("classquest:theme");
        const savedSession = JSON.parse(localStorage.getItem("classquest:session") || "null");
        if (savedSession?.token && savedSession?.account?.id && (savedTheme === "light" || savedTheme === "dark")) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch { /* Storage may be unavailable in private browsing. */ }
    </script>

    <script>
      // Aligne la bannière ET le panneau cookies sur la langue de l'app.
      // Forcer aussi "fr" évite que tarteaucitron suive la langue du navigateur.
      (function () {
        try {
          var stored = localStorage.getItem("classquest.lang");
          var lang = (stored || document.documentElement.lang || "fr").slice(0, 2).toLowerCase();
          window.tarteaucitronForceLanguage = lang === "en" ? "en" : "fr";
        } catch (error) {
          window.tarteaucitronForceLanguage = "fr";
        }
      })();
    </script>

    <noscript>
      <main>
        <h1>Class Odyssey</h1>
        <p>Class Odyssey transforme la progression en anglais en aventure collective. Chaque élève fait évoluer son héros en gagnant de l'XP, des niveaux et des récompenses, pendant que l'enseignant garde la main sur la classe en quelques gestes.</p>
        <p>Activez JavaScript puis rendez-vous sur <a href="https://classodyssey.com/">classodyssey.com</a> pour créer votre classe et lancer la première quête.</p>
      </main>

        </span>
        <span class="lang-flag lang-flag-en" aria-hidden="true">
          <svg viewBox="0 0 60 30" focusable="false">
            <clipPath id="lang-uk-clip"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 60,30 M60,0 0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 60,30 M60,0 0,30" stroke="#C8102E" stroke-width="4" clip-path="url(#lang-uk-clip)"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
          </svg>
        </span>
        <span id="current-lang">EN</span>
      </button>
