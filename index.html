<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The app may be served under a sub-path (e.g. /game-of-more). Relative
      // URLs — assets and the /api routes alike — only resolve correctly when
      // the path ends with a slash, so restore it before anything else loads.
      // A last segment containing a dot is a file (index.html): leave it alone.
      const last = location.pathname.split("/").pop();
      if (last && !last.includes(".")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Game of More — transforme ton cours d'anglais en quête médiévale." />
    <meta name="theme-color" content="#0A1220" />
    <title>Game of More</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./src/characters.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="dialog-root"></div>
    <div id="language-switcher">
      <button id="lang-toggle" aria-label="Changer de langue" title="Changer de langue">
        <span id="current-lang">FR</span>
      </button>
    </div>
    <script type="module" src="./src/app.mjs"></script>
    <script type="module" src="./src/i18n.mjs"></script>
  </body>
</html>
