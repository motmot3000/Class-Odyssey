<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The app may be served under a sub-path (e.g. /game-of-more). Relative
      // URLs — assets and the /api routes alike — only resolve correctly when
      // the path ends with a slash, so restore it before anything else loads.
      // A last segment containing a dot is a file (index.html): leave it alone.
      const last = location.pathname.split("/").pop();
      if (last && !last.includes(".")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Game of More — transforme ton cours d'anglais en quête médiévale." />
    <meta name="theme-color" content="#0A1220" />
    <title>Game of More</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/shell.css" />
    <link rel="stylesheet" href="./src/characters.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="seal" viewBox="0 0 48 48">
          <path d="M4 24C12 14 36 14 44 24 36 34 12 34 4 24Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="24" cy="24" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="1.9" fill="currentColor"/>
          <path d="M16 16 13 9M24 14V6M32 16l3-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M24 32.5c-3 4-3 7.6 0 10.5 3-2.9 3-6.5 0-10.5Z" fill="currentColor"/>
        </symbol>
      </defs>
    </svg>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="dialog-root"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div id="language-switcher">
      <button id="lang-toggle" aria-label="Changer de langue" title="Changer de langue">
        <span id="current-lang">FR</span>
      </button>
    </div>
    <script type="module" src="./src/app.mjs"></script>
    <script type="module" src="./src/i18n.mjs"></script>
  </body>
</html>
