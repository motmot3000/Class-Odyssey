<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The app may be served under a sub-path (e.g. /class-odyssey). Relative
      // URLs — assets and the /api routes alike — only resolve correctly when
      // the path ends with a slash, so restore it before anything else loads.
      // A last segment containing a dot is a file (index.html): leave it alone.
      const last = location.pathname.split("/").pop();
      if (last && !last.includes(".")) {
        location.replace(location.pathname + "/" + location.search + location.hash);
      }
      // Light on first visit; preserve an explicit choice before styles load.
      try {
        const savedTheme = localStorage.getItem("classquest:theme");
        const savedSession = JSON.parse(localStorage.getItem("classquest:session") || "null");
        if (savedSession?.token && savedSession?.account?.id && (savedTheme === "light" || savedTheme === "dark")) {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch { /* Storage may be unavailable in private browsing. */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Class Odyssey" />
    <meta name="theme-color" content="#e7e9df" />
    <title>Class Odyssey</title>
    <link rel="icon" href="./assets/brand/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./assets/brand/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./assets/brand/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./assets/brand/icons/site.webmanifest" />
    <link rel="stylesheet" href="./src/fonts.css" />
    <link rel="stylesheet" href="./src/sheikah.css" />
    <link rel="stylesheet" href="./src/brand.css" />
    <link rel="stylesheet" href="./src/shell.css" />
    <link rel="stylesheet" href="./src/characters.css" />
    <link rel="stylesheet" href="./src/welcome.css" />
  </head>
  <body>
    <!-- Static, light entry screen: landscape, invitation and account form. -->
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="dialog-root"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div id="language-switcher">
      <button id="lang-toggle" aria-label="Changer de langue" title="Changer de langue">
        <span id="current-lang">FR</span>
      </button>
    </div>
    <script type="module" src="./src/app.mjs"></script>
    <script type="module" src="./src/i18n.mjs"></script>
  </body>
</html>
