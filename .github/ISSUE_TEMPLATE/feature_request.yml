name: Proposal / Proposition
description: Suggest a focused improvement, including documentation or teaching use.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        French and English welcome. This is a young personal project: a proposal is not a delivery commitment.
  - type: textarea
    id: need
    attributes:
      label: Need / Besoin
      description: Who needs this, and what concrete problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach / Approche proposée
      description: Describe the smallest useful change and possible alternatives.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and verification / Impact et vérification
      description: Classroom use, accessibility, FR/EN, data, privacy, assets, licenses and how to check success.
  - type: dropdown
    id: contribution
    attributes:
      label: Can you help? / Participation
      options:
        - Feedback or testing / Retours ou tests
        - Documentation or translation / Documentation ou traduction
        - Code or original assets / Code ou assets originaux
        - Proposal only / Proposition uniquement
