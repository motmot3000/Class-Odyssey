name: classquest

services:
  api:
    build:
      context: .
    image: class-odyssey-api:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Contain a memory leak or a password-hashing burst without starving the host.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      HOST: 0.0.0.0
      PORT: 5180
      DATA_DIR: /data
      MAX_BACKUPS: 60
      MAX_ACCOUNTS: 500
      # Caddy terminates TLS and forwards to 127.0.0.1:5180; trusting its
      # X-Forwarded-For restores per-client rate limiting.
      TRUST_PROXY: "1"
      FOUNDER_USERNAME: ${FOUNDER_USERNAME:?FOUNDER_USERNAME is required}
      FOUNDER_PASSWORD: ${FOUNDER_PASSWORD:?FOUNDER_PASSWORD is required}
      NODE_ENV: production
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5180/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
