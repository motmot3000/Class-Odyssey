name: game-of-more

services:
  api:
    build:
      context: .
    image: game-of-more-api:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      HOST: 0.0.0.0
      PORT: 5180
      DATA_DIR: /data
      MAX_BACKUPS: 60
      FOUNDER_USERNAME: ${FOUNDER_USERNAME:?FOUNDER_USERNAME is required}
      FOUNDER_PASSWORD: ${FOUNDER_PASSWORD:?FOUNDER_PASSWORD is required}
      NODE_ENV: production
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5180/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
